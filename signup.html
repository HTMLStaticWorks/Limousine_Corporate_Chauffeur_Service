<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Create a Client or Corporate Account with Chauffeur Mobility.">
  <title>Sign Up · Chauffeur.</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- FIXED TOP RIGHT CORNER CONTROLS (ALWAYS VISIBLE) -->
  <div class="auth-top-corner">
    <button class="theme-toggle" type="button" aria-label="Switch theme">☀</button>
    <button class="dir-toggle" type="button" aria-label="Switch text direction">RTL</button>
  </div>

  <main style="min-height:100vh;display:grid;place-items:center;padding:75px 20px 40px">
    <div class="form-card reveal" style="width:min(480px,100%)">
      
      <!-- LOGO CENTERED ON FORM -->
      <div class="auth-logo-center">
        <a class="brand" href="index.html">
          <img src="logo.png" alt="CHAUFFEUR." class="brand-logo-img">
        </a>
      </div>

      <div style="text-align:center;margin-bottom:25px">
        <span class="eyebrow">Client Registration</span>
        <h1 class="display" style="font-size:32px;margin:6px 0 0">Create your account.</h1>
        <p class="muted" style="font-size:13px;margin:4px 0 0">Experience premium chauffeur services worldwide.</p>
      </div>

      <!-- SIGN UP FORM (REDIRECTS TO HOME PAGE ON SUBMIT) -->
      <form id="auth-signup-form" data-redirect="index.html">
        <div class="field">
          <label for="signup-name">Full Name</label>
          <input required type="text" id="signup-name" placeholder="John Doe" autocomplete="name">
        </div>

        <div class="field" style="margin-top:14px">
          <label for="signup-email">Email Address</label>
          <input required type="email" id="signup-email" placeholder="name@company.com" autocomplete="email">
        </div>
        
        <div class="field" style="margin-top:14px">
          <label for="signup-pass">Password</label>
          <div class="password-wrapper">
            <input required type="password" id="signup-pass" placeholder="••••••••••••" autocomplete="new-password">
            <button type="button" class="pass-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="field" style="margin-top:14px">
          <label for="signup-confirm-pass">Confirm Password</label>
          <div class="password-wrapper">
            <input required type="password" id="signup-confirm-pass" placeholder="••••••••••••" autocomplete="new-password">
            <button type="button" class="pass-toggle-btn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options" style="margin-top:16px">
          <label class="checkbox-field">
            <input required type="checkbox" id="terms-agree">
            <span>I agree to the Terms of Service & Privacy Policy</span>
          </label>
        </div>

        <button class="btn primary" style="margin-top:22px;width:100%" type="submit">Create Account →</button>
      </form>

      <div style="text-align:center;margin:22px 0 16px;position:relative">
        <hr style="border:0;border-top:1px solid var(--line);margin:0">
        <span style="position:relative;top:-11px;background:var(--panel);padding:0 12px;color:var(--muted);font-size:12px">or sign up with</span>
      </div>

      <!-- GOOGLE AND APPLE SIGN UP BUTTONS -->
      <div style="display:grid;gap:10px">
        <button class="btn-social btn-social-google" type="button" data-auth-social="Google">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Sign up with Google
        </button>
        <button class="btn-social btn-social-apple" type="button" data-auth-social="Apple">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.54c.66-.8 1.12-1.92.99-3.04-1 .04-2.17.67-2.88 1.5-.63.73-1.18 1.88-1.03 3 .01 0 .04.01.07.01 1.08 0 2.19-.67 2.85-1.47z"/></svg>
          Sign up with Apple
        </button>
      </div>

      <div style="margin-top:22px;padding-top:15px;border-top:1px solid var(--line);text-align:center">
        <span class="muted" style="font-size:13px">Already have an account? </span>
        <a href="login.html" style="color:var(--accent2);font-weight:700;font-size:13px">Sign In →</a>
      </div>
    </div>
  </main>

  <div class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
